<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Пакетная загрузка Excel
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family:
                Arial,
                sans-serif;
            background: #f3f4f6;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow:
                0 5px 25px
                rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .drop-zone {
            padding: 50px 20px;
            text-align: center;
            border: 2px dashed #2563eb;
            border-radius: 12px;
            background: #eff6ff;
            cursor: pointer;
        }

        .drop-zone.dragover {
            background: #dbeafe;
        }

        .drop-icon {
            font-size: 50px;
        }

        .drop-title {
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .drop-description {
            margin-top: 8px;
            color: #6b7280;
        }

        #fileInput {
            display: none;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-select {
            background: #2563eb;
            color: white;
        }

        .btn-upload {
            background: #059669;
            color: white;
        }

        .btn-clear {
            background: #e5e7eb;
        }

        .files {
            margin-top: 25px;
        }

        .file {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            margin-bottom: 8px;
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            background: white;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-size {
            margin-top: 4px;
            color: #6b7280;
            font-size: 13px;
        }

        .status {
            min-width: 150px;
            text-align: right;
            font-weight: bold;
        }

        .status-uploaded {
            color: #2563eb;
        }

        .status-waiting {
            color: #d97706;
        }

        .status-processing {
            color: #7c3aed;
        }

        .status-completed {
            color: #059669;
        }

        .status-error {
            color: #dc2626;
        }

        .progress-wrapper {
            margin-top: 25px;
            display: none;
        }

        .progress-wrapper.visible {
            display: block;
        }

        .progress-bar {
            height: 12px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            width: 0;
            height: 100%;
            background: #2563eb;
            transition: width 0.3s;
        }

        .progress-text {
            margin-bottom: 8px;
            font-weight: bold;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 10px;
            display: none;
        }

        .result.success {
            display: block;
            background: #d1fae5;
            color: #065f46;
        }

        .result.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .remove {
            background: #fee2e2;
            color: #991b1b;
            padding: 7px 10px;
        }

        @media (
            max-width: 650px
        ) {

            .container {
                padding: 20px 15px;
            }

            .file {
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .status {
                width: 100%;
                text-align: left;
            }

            .buttons button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="container">

    <h1>
        📦 Пакетная загрузка Excel
    </h1>

    <p>
        Выберите один или несколько файлов.
        После загрузки система покажет
        реальный статус обработки каждого файла.
    </p>


    <input
        id="fileInput"
        type="file"
        accept=".xlsx,.xls"
        multiple
    >


    <div
        id="dropZone"
        class="drop-zone"
    >

        <div class="drop-icon">
            📊
        </div>

        <div class="drop-title">
            Выберите Excel-файлы
        </div>

        <div class="drop-description">
            Можно выбрать несколько файлов
            или перетащить их сюда
        </div>

    </div>


    <div class="buttons">

        <button
            id="selectButton"
            class="btn-select"
        >
            📂 Выбрать файлы
        </button>

        <button
            id="uploadButton"
            class="btn-upload"
            disabled
        >
            🚀 Загрузить
        </button>

        <button
            id="clearButton"
            class="btn-clear"
            disabled
        >
            🗑 Очистить
        </button>

    </div>


    <div
        id="files"
        class="files"
    ></div>


    <div
        id="progressWrapper"
        class="progress-wrapper"
    >

        <div
            id="progressText"
            class="progress-text"
        >
            Подготовка...
        </div>

        <div class="progress-bar">

            <div
                id="progress"
                class="progress"
            ></div>

        </div>

    </div>


    <div
        id="result"
        class="result"
    ></div>


</div>


<script>

"use strict";


const fileInput =
    document.getElementById(
        "fileInput"
    );


const dropZone =
    document.getElementById(
        "dropZone"
    );


const selectButton =
    document.getElementById(
        "selectButton"
    );


const uploadButton =
    document.getElementById(
        "uploadButton"
    );


const clearButton =
    document.getElementById(
        "clearButton"
    );


const filesContainer =
    document.getElementById(
        "files"
    );


const progressWrapper =
    document.getElementById(
        "progressWrapper"
    );


const progress =
    document.getElementById(
        "progress"
    );


const progressText =
    document.getElementById(
        "progressText"
    );


const result =
    document.getElementById(
        "result"
    );


let selectedFiles = [];

let jobs = [];

let pollingTimer = null;


/* ============================================================
   Выбор файлов
============================================================ */


selectButton.addEventListener(
    "click",
    () => {

        fileInput.click();

    }
);


dropZone.addEventListener(
    "click",
    () => {

        fileInput.click();

    }
);


fileInput.addEventListener(
    "change",
    event => {

        addFiles(
            Array.from(
                event.target.files
            )
        );

        fileInput.value = "";

    }
);


/* ============================================================
   Drag & Drop
============================================================ */


[
    "dragenter",
    "dragover"
].forEach(
    eventName => {

        dropZone.addEventListener(
            eventName,
            event => {

                event.preventDefault();

                dropZone.classList.add(
                    "dragover"
                );

            }
        );

    }
);


[
    "dragleave",
    "drop"
].forEach(
    eventName => {

        dropZone.addEventListener(
            eventName,
            event => {

                event.preventDefault();

                dropZone.classList.remove(
                    "dragover"
                );

            }
        );

    }
);


dropZone.addEventListener(
    "drop",
    event => {

        addFiles(
            Array.from(
                event.dataTransfer.files
            )
        );

    }
);


/* ============================================================
   Добавление файлов
============================================================ */


function addFiles(files) {

    for (
        const file
        of files
    ) {

        const name =
            file.name.toLowerCase();

        if (
            !name.endsWith(".xlsx")
            &&
            !name.endsWith(".xls")
        ) {

            continue;

        }


        const duplicate =
            selectedFiles.some(
                existing =>
                    existing.name ===
                    file.name
                    &&
                    existing.size ===
                    file.size
            );


        if (!duplicate) {

            selectedFiles.push(
                file
            );

        }

    }


    renderFiles();

}


/* ============================================================
   Отображение списка
============================================================ */


function renderFiles() {

    filesContainer.innerHTML = "";


    selectedFiles.forEach(
        (file, index) => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "file";


            element.innerHTML = `

                <div>
                    📄
                </div>

                <div class="file-info">

                    <div class="file-name">
                        ${escapeHtml(
                            file.name
                        )}
                    </div>

                    <div class="file-size">
                        ${formatSize(
                            file.size
                        )}
                    </div>

                </div>

                <div class="status">
                    Готов к загрузке
                </div>

                <button
                    class="remove"
                    type="button"
                    onclick="removeFile(${index})"
                >
                    Удалить
                </button>

            `;


            filesContainer.appendChild(
                element
            );

        }
    );


    uploadButton.disabled =
        selectedFiles.length === 0;


    clearButton.disabled =
        selectedFiles.length === 0;

}


/* ============================================================
   Удаление
============================================================ */


function removeFile(index) {

    selectedFiles.splice(
        index,
        1
    );

    renderFiles();

}


clearButton.addEventListener(
    "click",
    () => {

        selectedFiles = [];

        jobs = [];

        renderFiles();

        result.className =
            "result";

        result.textContent = "";

        progressWrapper.classList.remove(
            "visible"
        );

    }
);


/* ============================================================
   Загрузка
============================================================ */


uploadButton.addEventListener(
    "click",
    async () => {

        if (
            selectedFiles.length === 0
        ) {
            return;
        }


        uploadButton.disabled =
            true;

        clearButton.disabled =
            true;

        selectButton.disabled =
            true;


        progressWrapper.classList.add(
            "visible"
        );


        progressText.textContent =
            "Загрузка файлов...";


        progress.style.width =
            "0%";


        const formData =
            new FormData();


        selectedFiles.forEach(
            file => {

                formData.append(
                    "files",
                    file
                );

            }
        );


        try {

            const response =
                await fetch(
                    "/upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok
                ||
                !data.success
            ) {

                throw new Error(
                    data.error
                    ||
                    "Ошибка загрузки"
                );

            }


            jobs =
                data.jobs.filter(
                    job =>
                        job.success
                );


            updateStatuses(
                data.jobs
            );


            progressText.textContent =
                "Файлы загружены. Ожидание обработки...";


            startPolling();


        } catch (error) {

            showResult(
                "Ошибка загрузки: "
                + error.message,
                false
            );


            uploadButton.disabled =
                false;

            clearButton.disabled =
                false;

            selectButton.disabled =
                false;

        }

    }
);


/* ============================================================
   Опрос статусов
============================================================ */


function startPolling() {

    if (pollingTimer) {

        clearInterval(
            pollingTimer
        );

    }


    pollStatuses();


    pollingTimer =
        setInterval(
            pollStatuses,
            500
        );

}


async function pollStatuses() {

    if (
        jobs.length === 0
    ) {

        stopPolling();

        return;

    }


    const statuses = [];


    for (
        const job
        of jobs
    ) {

        try {

            const response =
                await fetch(
                    "/upload/status/"
                    + encodeURIComponent(
                        job.job_id
                    ),
                    {
                        cache: "no-store"
                    }
                );


            if (
                !response.ok
            ) {
                continue;
            }


            const data =
                await response.json();


            if (
                data.success
                &&
                data.job
            ) {

                statuses.push(
                    data.job
                );

            }

        } catch (
            error
        ) {

            console.error(
                error
            );

        }

    }


    if (
        statuses.length > 0
    ) {

        updateStatuses(
            statuses
        );

    }


    const completed =
        statuses.filter(
            job =>
                job.status ===
                    "completed"
                ||
                job.status ===
                    "error"
        ).length;


    const total =
        jobs.length;


    const percent =
        total > 0
            ? (
                completed
                /
                total
            ) * 100
            : 0;


    progress.style.width =
        percent + "%";


    progressText.textContent =
        `Обработано: ${completed} из ${total}`;


    if (
        completed >= total
        &&
        total > 0
    ) {

        stopPolling();

        const errors =
            statuses.filter(
                job =>
                    job.status ===
                    "error"
            );


        if (
            errors.length === 0
        ) {

            showResult(
                `✓ Все файлы успешно обработаны: ${total}`,
                true
            );

        } else {

            showResult(
                `⚠ Обработка завершена. Успешно: ${total - errors.length}, ошибок: ${errors.length}`,
                false
            );

        }


        uploadButton.disabled =
            false;

        clearButton.disabled =
            false;

        selectButton.disabled =
            false;

    }

}


/* ============================================================
   Остановка опроса
============================================================ */


function stopPolling() {

    if (pollingTimer) {

        clearInterval(
            pollingTimer
        );

        pollingTimer = null;

    }

}


/* ============================================================
   Обновление статусов
============================================================ */


function updateStatuses(
    statuses
) {

    const elements =
        filesContainer.children;


    statuses.forEach(
        job => {

            const index =
                selectedFiles.findIndex(
                    file =>
                        file.name ===
                        job.filename
                );


            if (
                index < 0
            ) {
                return;
            }


            const element =
                elements[index];

            if (!element) {
                return;
            }


            const statusElement =
                element.querySelector(
                    ".status"
                );


            if (!statusElement) {
                return;
            }


            statusElement.className =
                "status "
                +
                "status-"
                +
                job.status;


            statusElement.textContent =
                getStatusText(
                    job
                );


            /*
             * Убираем кнопку удаления,
             * когда обработка уже завершена.
             */

            if (
                job.status ===
                    "completed"
                ||
                job.status ===
                    "error"
            ) {

                const button =
                    element.querySelector(
                        ".remove"
                    );

                if (button) {
                    button.remove();
                }

            }

        }
    );

}


/* ============================================================
   Текст статуса
============================================================ */


function getStatusText(
    job
) {

    switch (
        job.status
    ) {

        case "uploaded":

            return "⬆ Загружен";


        case "waiting":

            return "⏳ Ожидает обработки";


        case "processing":

            return "⚙ Обрабатывается";


        case "completed":

            return "✓ Обработан";


        case "error":

            return "✗ Ошибка";


        default:

            return job.message
                || "Неизвестный статус";

    }

}


/* ============================================================
   Результат
============================================================ */


function showResult(
    message,
    success
) {

    result.className =
        "result "
        +
        (
            success
                ? "success"
                : "error"
        );


    result.textContent =
        message;

}


/* ============================================================
   Формат размера
============================================================ */


function formatSize(
    bytes
) {

    if (
        bytes < 1024
    ) {

        return bytes + " Б";

    }


    if (
        bytes < 1024 * 1024
    ) {

        return (
            bytes / 1024
        ).toFixed(1)
        + " КБ";

    }


    return (
        bytes
        /
        1024
        /
        1024
    ).toFixed(1)
    + " МБ";

}


/* ============================================================
   Защита HTML
============================================================ */


function escapeHtml(
    value
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value;

    return div.innerHTML;

}


</script>


</body>

</html>
